spring.application.name=cat-life-system
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cat_life?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.catlife.entity

# 开发阶段打印SQL
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt.secret=cat-life-system-jwt-secret-key-2024-this-is-a-very-long-secret-key
jwt.expiration=604800000
